<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .task-list {
            list-style-type: none;
            padding-left: 0;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            background-color: #f9f9f9;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .task-item button {
            background-color: #ff6666;
            border: none;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .task-item button:hover {
            background-color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>
        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Add a new task" required style="width: 80%; padding: 10px;">
            <button type="submit" style="padding: 10px; cursor: pointer;">Add</button>
        </form>
        <ul class="task-list">
            {% for task in tasks %}
                <li class="task-item">
                    <span>{{ task }}</span>
                    <a href="/delete/{{ task }}"><button>Delete</button></a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
